<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechFlow Tasks</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1>TechFlow Tasks</h1>
    <form id="task-form" class="task-form">
      <input name="title" placeholder="Título da tarefa" maxlength="100" required>
      <input name="description" placeholder="Descrição (opcional)" maxlength="500">
      <select name="priority" aria-label="Prioridade">
        {% for key, label in priority_labels.items() %}
        <option value="{{ key }}" {% if key == "medium" %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
      <button type="submit">Adicionar</button>
    </form>
    <form method="get" class="filter-form">
      <label for="priority-filter">Filtrar por prioridade:</label>
      <select id="priority-filter" name="priority" onchange="this.form.submit()">
        <option value="">Todas</option>
        {% for key, label in priority_labels.items() %}
        <option value="{{ key }}" {% if key == selected_priority %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
    <p id="form-error" class="form-error" hidden></p>
  </header>

  <main class="board">
    {% for column in columns %}
    <section class="column" data-status="{{ column.key }}">
      <h2>{{ column.label }} <span class="count">{{ column.tasks|length }}</span></h2>
      {% for task in column.tasks %}
      <article class="card" data-id="{{ task.id }}" data-status="{{ task.status }}">
        <span class="badge badge-{{ task.priority }}">{{ priority_labels[task.priority] }}</span>
        <h3>{{ task.title }}</h3>
        {% if task.description %}<p>{{ task.description }}</p>{% endif %}
        <div class="actions">
          <button data-action="back" title="Mover para a coluna anterior">&larr;</button>
          <button data-action="forward" title="Mover para a próxima coluna">&rarr;</button>
          <button data-action="edit">Editar</button>
          <button data-action="delete" class="danger">Excluir</button>
        </div>
      </article>
      {% endfor %}
    </section>
    {% endfor %}
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
